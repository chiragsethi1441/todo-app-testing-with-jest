name: Build
on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
jobs:
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run tests with coverage
        run: npm t -- --coverage --watchAll=false
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  security-and-package:
    name: Security Scan, Build & Push
    runs-on: ubuntu-latest
    needs: sonarqube
    steps:
      - uses: actions/checkout@v4

      - name: Trivy filesystem scan (dependencies)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Build Docker image
        run: docker build -t chiragsethi0902/todo-app-testing-with-jest:${{ github.sha }} .

      - name: Save image as tarball for scanning
        run: docker save -o image.tar chiragsethi0902/todo-app-testing-with-jest:${{ github.sha }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: image.tar
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: chiragsethi0902
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        run: docker push chiragsethi0902/todo-app-testing-with-jest:${{ github.sha }}